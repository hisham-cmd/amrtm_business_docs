# ─────────────────────────────────────────────────────────────
#  قالب إعدادات الإنتاج — انسخه إلى production-db.cfg واملأه
#  ⚠️ لا ترفع production-db.cfg إلى Git إطلاقاً.
# ─────────────────────────────────────────────────────────────

# ── قاعدة بيانات الإنتاج ──
# ملاحظة مهمة في InfinityFree: استضافة MySQL لا تُتاح عبر الإنترنت.
# sql*.infinityfree.com لا يُحل إلا من داخل شبكة InfinityFree،
# لذا لا يمكنك الاتصال مباشرة من جهازك. استخدم phpMyAdmin من لوحة
# التحكم، أو أداة prod-db.php المرفوعة على السيرفر.
DB_HOST=sqlXXX.infinityfree.com
DB_PORT=3306
DB_DATABASE=YOUR_DATABASE_NAME
DB_USERNAME=YOUR_DB_USERNAME
DB_PASSWORD=YOUR_DB_PASSWORD

# ── إعدادات التطبيق ──
APP_ENV=production

# ⚠️ APP_DEBUG يجب أن يكون false في الإنتاج.
#    true يكشف مسارات الملفات وأخطاء SQL في صفحات الزوار.
APP_DEBUG=false

APP_URL=https://your-domain.com

# ⚠️ لا تضع APP_KEY الحقيقي في أي ملف داخل المستودع.
#    ولّده بالأمر:  php artisan key:generate --show
#    وضعه في .env على السيرفر عبر لوحة الاستضافة.
APP_KEY=base64:GENERATE_YOUR_OWN_KEY

APP_LOCALE=ar
APP_FALLBACK_LOCALE=ar
APP_FAKER_LOCALE=ar_SA
BCRYPT_ROUNDS=12
SESSION_LIFETIME=120
CACHE_STORE=file
QUEUE_CONNECTION=file
LOG_LEVEL=warning
LOG_CHANNEL=stack
MAIL_MAILER=log
BROADCAST_CONNECTION=log
FILESYSTEM_DISK=local
