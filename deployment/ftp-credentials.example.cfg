# ─────────────────────────────────────────────────────────────
#  قالب بيانات الاتصال — انسخه إلى ftp-credentials.cfg واملأه
#  ⚠️ لا ترفع ftp-credentials.cfg إلى Git. الملف مُتجاهَل أصلاً،
#     لكن لا تعتمد على ذلك وحده.
# ─────────────────────────────────────────────────────────────

# اسم المضيف
FTP_HOST=ftpupload.net

# المنفذ
FTP_PORT=21

# اسم المستخدم — من لوحة تحكم الاستضافة
FTP_USER=YOUR_FTP_USERNAME

# كلمة المرور — من لوحة تحكم الاستضافة
FTP_PASS=YOUR_FTP_PASSWORD

# المسار الهدف داخل جذر FTP.
# ‏InfinityFree يحصر جذر FTP في مجلد حسابك، لذا المسار نسبي:
# المسار الكامل  /home/vol9_x/infinityfree.com/<user>/htdocs/backend
# تكتب فقط:     htdocs/backend
FTP_ROOT=htdocs/backend

# مسار مشروع الباك اند على جهاز المطور.
# هذا ما يجعل الأداة تعمل من خارج المستودع.
LOCAL_PROJECT=C:\path\to\your\amrtm_business_backend
